[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "percnet-epsr"
version = "0.1.0"
description = "No-NWP PERC-Net v2 + xCPD + reserve scheduling for EPSR"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "torch>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
