protocol: honest
horizons: [24]
seeds: [2024, 2025, 2026, 2027, 2028]
windows: all              # all test windows; stratify by season/peak
scenarios: 8
risk: cvar
cvar_alpha: 0.95
reserve_policies: [median, fixed5, fixed10, q90, q95, stochastic, oracle, rl]
metrics: [expected_cost, cvar95_cost, eens_e, eens_h, eens_c, lolp,
          reserve_shortfall, vss, evpi, starts, co2]
stats: [paired_bootstrap, wilcoxon]
sensitivity:
  grid_price: [0.7, 0.85, 1.0, 1.15, 1.3]
  ramp: [0.5, 0.75, 1.0]
  shed_penalty: [1, 5, 10]
rl:
  type: bandit            # bandit | ppo
  rho_grid: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  reward: negative_dispatch_cost_plus_shed
